<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <meta name="theme-color" content="#042551">
  <title>Amanyu’s Flapendium</title>
  <meta name="application-name" content="Flapendium">
  <meta name="apple-mobile-web-app-title" content="Flapendium">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" as="image" href="icons/splash.webp">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #f8fafc; --panel-dark: #1e293b; --panel-light: #ffffff;
      --accent-blue: #3b82f6; --text-dark: #0f172a; --text-muted: #64748b;
      --border-color: #e2e8f0; --matrix-bg: #cbd5e1; --matrix-card: #ffffff;
      --topbar-h: 50px; --brand-navy: #042551; --brand-flap: #f5c451; --brand-flap-on-light: #b7791f;
      --brand-font: 'Cinzel', Georgia, 'Times New Roman', serif;
    }

    body.dark-theme {
      --bg-main: #0f172a; --panel-dark: #020617; --panel-light: #1e293b;
      --text-dark: #f1f5f9; --text-muted: #94a3b8;
      --border-color: #334155; --matrix-bg: #020617; --matrix-card: #1e293b;
    }

    body { user-select: none; -webkit-user-select: none; font-family: -apple-system, sans-serif; margin: 0; background: var(--bg-main); color: var(--text-dark); overflow: hidden; height: 100vh; overscroll-behavior: none; transition: background 0.3s, color 0.3s; }
    ::-webkit-scrollbar { width: 0px; }
    
    /* TOP CONSTANT STATUS BAR */
    .top-status-bar { position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h); background: var(--brand-navy); color: white; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 0 12px; box-sizing: border-box; z-index: 1000; box-shadow: 0 2px 6px rgba(0,0,0,0.35); }
    .brand-logo { height: calc(var(--topbar-h) - 10px); width: auto; aspect-ratio: 1; border-radius: 8px; flex-shrink: 0; }
    .brand-name { font-family: var(--brand-font); font-weight: 700; font-size: 1.35rem; letter-spacing: 0.5px; line-height: 1; white-space: nowrap; }
    .brand-flap { color: var(--brand-flap); }
    .login-logo { width: 96px; height: 96px; border-radius: 20px; display: block; margin: 0 auto 16px; box-shadow: 0 6px 16px rgba(4,37,81,0.35); }
    .login-container h2.brand-name { white-space: normal; line-height: 1.2; }
    body:not(.dark-theme) .login-container .brand-flap { color: var(--brand-flap-on-light); }

    /* OFFSET EVERYTHING DOWN BY 25PX */
    .app-container { display: flex; height: calc(100vh - var(--topbar-h)); width: 100vw; margin-top: var(--topbar-h); }

    /* OVERLAY FOR SIDEBAR (NOW GLOBAL) */
    .sidebar-overlay { display: none; position: fixed; top: var(--topbar-h); left: 0; width: 100vw; height: calc(100vh - var(--topbar-h)); background: rgba(0,0,0,0.5); z-index: 899; opacity: 0; transition: opacity 0.3s; }
    .sidebar-overlay.active { opacity: 1; }

    /* SIDEBAR IS NOW A HIDDEN DRAWER GLOBALLY (PC & MOBILE) */
    .sidebar { position: fixed; left: 0; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); width: 260px; background: var(--panel-dark); color: white; display: flex; flex-direction: column; z-index: 900; transform: translateX(-100%); touch-action: pan-y; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s; }
    .sidebar.open { transform: translateX(0); }
    
    .sidebar-brand { padding: 24px 20px; font-size: 1.15rem; font-weight: 700; border-bottom: 1px solid #334155; }
    
    .sidebar-menu { flex: 1; padding: 20px 12px; overflow-y: auto; }
    .menu-item { padding: 12px 16px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; font-weight: 500; color: #94a3b8; transition: 0.2s; }
    .menu-item:hover, .menu-item.active { color: white; background: #334155; }
    .menu-item.active { background: var(--accent-blue); }
    /* REGION TILES (icon + name) IN THE SIDEBAR: square tiles sized from the panel's width (about half the screen);
       they only shrink when the screen is too short to fit them, and any spare height stays empty below */
    .sidebar { width: clamp(296px, 50vw, 420px); max-width: 86vw; }
    .sidebar .sidebar-brand { padding: 16px 20px; }
    .sidebar-menu.region-grid { container-type: size; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: max-content; align-content: start; gap: 10px; padding: 12px; }
    /* tiles fill their column; their height (--s) equals the column width (square), unless the screen is too short,
       in which case they get a third of the height left after the two wide bars */
    .menu-item.region-tile { --w: clamp(58px, 13.5cqh, 86px); --s: max(80px, min(calc((100cqw - 10px) / 2), calc((100cqh - 40px - 2 * var(--w)) / 3))); height: var(--s); }
    .menu-item.region-tile.wide { height: var(--w); }
    .menu-item.region-tile { margin: 0; padding: 4px 4px 6px; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; text-align: center; border-radius: 16px; background: rgba(148, 163, 184, 0.07); border: 1px solid #334155; color: #cbd5e1; font-size: clamp(0.75rem, calc((100cqw - 10px) * 0.052), 1.15rem); font-weight: 600; letter-spacing: 0.2px; line-height: 1.15; box-sizing: border-box; overflow: hidden; }
    .menu-item.region-tile.wide { grid-column: 1 / -1; flex-direction: row; justify-content: flex-start; gap: 14px; padding: 4px 18px 4px 10px; text-align: left; }
    /* About / Help sit side by side to leave room for the region blocks */
    .sidebar-system .menu-item { display: inline-block; padding: 8px 14px; margin: 0 6px 2px 0; font-size: 0.9rem; }
    .menu-item.region-tile:hover { background: #334155; color: white; }
    .menu-item.region-tile.active { background: var(--accent-blue); border-color: var(--accent-blue); color: white; box-shadow: 0 6px 14px rgba(59, 130, 246, 0.35); }
    /* the drawing takes all the room above the name */
    .region-icon { flex: 1 1 0; min-height: 0; width: 100%; background-color: #93c5fd; -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat; transition: background-color 0.2s; }
    .region-label { flex-shrink: 0; white-space: nowrap; }
    .region-tile.wide .region-icon { flex: 0 0 auto; width: 104px; height: 100%; }
    .region-tile:hover .region-icon, .region-tile.active .region-icon { background-color: #ffffff; }
    .region-icon.no-icon { -webkit-mask: none; mask: none; background: rgba(147, 197, 253, 0.18); border-radius: 50%; color: #93c5fd; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 700; }
    .region-tile.active .region-icon.no-icon { background: rgba(255,255,255,0.25); color: white; }
    /* FAVOURITES (star buttons) */
    .fav-btn { background: transparent; border: none; padding: 0; cursor: pointer; color: var(--text-muted); line-height: 1; font-size: 1.35rem; opacity: 0.75; transition: color 0.15s, transform 0.15s, opacity 0.15s; -webkit-tap-highlight-color: transparent; }
    .fav-btn:hover { opacity: 1; }
    .fav-btn.on { color: #f59e0b; opacity: 1; }
    .fav-btn:active { transform: scale(1.25); }
    .flap-card { position: relative; }
    .fav-btn.card-fav { position: absolute; top: 8px; right: 10px; width: 30px; height: 30px; }
    .fav-btn.list-fav { flex-shrink: 0; width: 32px; height: 32px; font-size: 1.4rem; }
    .th-name { display: inline; }
    .th-fav-slot { display: inline-block; vertical-align: middle; margin-left: 8px; }
    .fav-btn.th-fav { font-size: 1.5rem; }
    .fav-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 1rem; line-height: 1.6; }
    .fav-empty-star { font-size: 2.6rem; color: #f59e0b; margin-bottom: 6px; }
    .system-divider { margin: 5px 12px 10px 12px; font-size: 0.7rem; text-transform: uppercase; color: #64748b; font-weight: 700; letter-spacing: 1px; }

    .sidebar-system { padding: 10px 12px; border-top: 1px solid #334155; display: none; }
    .sidebar-profile { padding: 20px; border-top: 1px solid #334155; display: none; flex-direction: column; gap: 12px; background: rgba(0,0,0,0.1); }
    .profile-email { font-size: 0.8rem; font-weight: 600; color: #cbd5e1; word-break: break-all; }
    .profile-controls { display: flex; gap: 10px; }
    .btn-sidebar { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #475569; background: transparent; color: #cbd5e1; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: 0.2s; text-align: center; }
    .btn-sidebar:hover { background: #334155; color: white; }
    .btn-logout { border-color: #7f1d1d; color: #fca5a5; }
    .btn-logout:hover { background: #7f1d1d; color: white; }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; width: 100%; }
    
    /* MODIFIED NAVBAR: Allows wrapping so the Compare button is never hidden */
    .navbar { min-height: 70px; height: auto; background: var(--panel-light); border-bottom: 1px solid var(--border-color); display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; padding: 10px 20px; gap: 15px; transition: background 0.3s, border-color 0.3s;}
    
    /* HAMBURGER BUTTON (NOW VISIBLE GLOBALLY) */
    .hamburger-btn { display: block; background: transparent; border: none; font-size: 1.8rem; color: var(--text-dark); cursor: pointer; padding: 0; margin-right: 5px; }

    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 400px; display: flex; }
    .search-bar { flex: 1; min-width: 0; width: 100%; padding: 10px 40px 10px 16px; border: 1px solid var(--border-color); border-radius: 20px; outline: none; background: var(--bg-main); color: var(--text-dark); transition: 0.2s; box-sizing: border-box; font-size: 1rem; }
    .search-bar:focus { border-color: var(--accent-blue); }
    .search-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border-radius: 50%; border: none; padding: 0; background: var(--border-color); color: var(--text-dark); font-size: 15px; line-height: 26px; text-align: center; cursor: pointer; display: none; }
    .search-clear:hover { background: var(--text-muted); color: white; }
    .search-clear.visible { display: block; }

    /* LIST (CONTENTS PAGE) VIEW */
    .list-layout { display: flex; flex-direction: column; max-width: 900px; margin: 0 auto; background: var(--panel-light); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
    .list-heading { padding: 10px 16px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-blue); background: var(--bg-main); border-bottom: 1px solid var(--border-color); }
    .list-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.15s; }
    .list-row:last-child { border-bottom: none; }
    .list-row:hover { background: var(--bg-main); }
    .list-num { min-width: 2.2em; text-align: right; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums; align-self: flex-start; padding-top: 1px; }
    .list-body { flex: 1; min-width: 0; }
    .list-title { font-weight: 600; font-size: 0.98rem; color: var(--text-dark); }
    .list-sub { font-size: 0.75rem; color: var(--text-muted); line-height: 1.35; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .list-check { width: 18px; height: 18px; flex-shrink: 0; cursor: pointer; }

    /* IMAGE GALLERY (inside a flap) */
    .img-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .img-thumb { margin: 0; cursor: zoom-in; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); background: var(--bg-main); }
    .img-thumb img { display: block; width: 100%; height: 130px; object-fit: cover; }
    .img-thumb figcaption { font-size: 0.72rem; color: var(--text-muted); padding: 4px 6px; line-height: 1.3; white-space: normal; }

    /* FULL-SCREEN IMAGE VIEWER */
    .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 2000; display: none; flex-direction: column; }
    .lightbox.open { display: flex; }
    .lb-stage { flex: 1; overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; cursor: grab; }
    .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; will-change: transform; }
    .lb-btn { position: absolute; background: rgba(255,255,255,0.15); color: white; border: none; border-radius: 50%; width: 44px; height: 44px; font-size: 22px; cursor: pointer; z-index: 2; }
    .lb-btn:hover { background: rgba(255,255,255,0.3); }
    .lb-close { top: 12px; right: 12px; }
    .lb-prev { left: 12px; top: 50%; transform: translateY(-50%); }
    .lb-next { right: 12px; top: 50%; transform: translateY(-50%); }
    .lb-footer { color: #e2e8f0; text-align: center; padding: 10px 16px 16px; font-size: 0.9rem; }
    .lb-count { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
    
    .control-group { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-left: auto; }
    select { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); outline: none; cursor: pointer; background: var(--panel-light); color: var(--text-dark); font-weight: 500; font-size: 0.85rem;}
    .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
    .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-dark); }
    .btn-outline:hover { background: var(--bg-main); }
    .btn-primary { background: var(--accent-blue); color: white; box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2); display: none; }
    .btn-primary.visible { display: block; }

    .workspace { flex: 1; padding: 20px 30px; overflow-x: hidden; overflow-y: auto; position: relative; }
    .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    
    .system-page-view { display: none; max-width: 800px; margin: 0 auto; background: var(--panel-light); padding: 40px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .system-page-view h2 { margin-top: 0; color: var(--accent-blue); font-size: 1.8rem; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
    .system-page-view div { font-size: 1.05rem; line-height: 1.7; white-space: pre-wrap; }
    .support-link { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px 22px 12px 16px; border-radius: 999px; background: #25d366; color: #ffffff; font-weight: 700; font-size: 1.05rem; text-decoration: none; box-shadow: 0 4px 12px rgba(37,211,102,0.35); }
    .support-link:active { transform: scale(0.97); }
    .support-link svg { width: 26px; height: 26px; flex-shrink: 0; }

    .flap-card { background: var(--panel-light); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 10px;}
    .flap-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border-color: var(--accent-blue); }
    .card-meta { font-size: 0.75rem; color: var(--accent-blue); font-weight: 700; }
    .card-title { font-size: 1.15rem; font-weight: 700; margin: 0; color: var(--text-dark); }
    .preview-text { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 5px;}
    .preview-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; opacity: 0.7; }
    .search-highlight { background: #fef08a; color: #854d0e; padding: 2px 4px; border-radius: 3px; font-weight: 600; }
    
    .card-actions { margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 12px; display: flex; justify-content: space-between; align-items: center;}
    .compare-toggle { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; }

    .matrix-fab { position: fixed; bottom: 30px; right: 30px; background: var(--accent-blue); color: white; padding: 12px 24px; border-radius: 30px; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4); display: none; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; z-index: 90; transition: transform 0.2s; }
    .matrix-fab:hover { transform: scale(1.05); }

    .comparison-dock { position: fixed; top: var(--topbar-h); left: 0; width: 100vw; height: calc(100vh - var(--topbar-h)); background: var(--matrix-bg); z-index: 800; display: flex; flex-direction: column; clip-path: circle(0% at calc(100% - 100px) calc(100% - 50px)); opacity: 0; pointer-events: none; transition: clip-path 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s, background 0.3s; }
    .comparison-dock.open { clip-path: circle(150% at calc(100% - 100px) calc(100% - 50px)); opacity: 1; pointer-events: auto; }
    .dock-header { height: 70px; background: var(--panel-dark); border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 30px; color: white; flex-shrink: 0; }
    
    .matrix-container { flex: 1; padding: 24px; overflow-x: auto; overflow-y: auto; }
    
    /* DYNAMIC MATRIX SIZING (Responsive to count & screen size) */
    .matrix-table { min-width: 100%; width: max-content; border-collapse: separate; border-spacing: 24px 0; table-layout: fixed; }
    .matrix-table th { position: sticky; top: 0; background: var(--matrix-card); color: var(--text-dark); padding: 20px; font-size: 1.25rem; font-weight: 700; z-index: 2; border-radius: 12px 12px 0 0; border-bottom: 2px solid var(--border-color); transition: 0.3s; 
      /* Formula: 100vw minus padding (48px) minus total gap width, divided equally. Caps at 4 on desktop. */
      width: calc((100vw - 48px - ((min(var(--col-count), 4) - 1) * 24px)) / min(var(--col-count), 4)); }
    .matrix-table td { background: var(--matrix-card); color: var(--text-dark); padding: 15px 20px; vertical-align: top; transition: 0.3s; 
      width: calc((100vw - 48px - ((min(var(--col-count), 4) - 1) * 24px)) / min(var(--col-count), 4)); }
    .matrix-table tr:last-child td { border-radius: 0 0 12px 12px; padding-bottom: 30px; }
    .row-label { font-size: 0.75rem; text-transform: uppercase; color: #f43f5e; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; }
    .cell-data { font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; }

    .login-container { box-sizing: border-box; max-width: 400px; margin: 100px auto; padding: 40px; background: var(--panel-light); border-radius: 16px; text-align: center; border: 1px solid var(--border-color); color: var(--text-dark); z-index: 10; position: relative;}
    .login-container input[type="email"] { width: 90%; padding: 12px; margin: 20px 0; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-main); color: var(--text-dark); box-sizing: border-box; }
    .login-container button { width: 90%; background: var(--accent-blue); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; box-sizing: border-box; margin-top: 10px; }
    #app-shell, .paywall { display: none; }

    /* OTP STYLES */
    .otp-container { display: none; gap: 12px; justify-content: center; margin: 20px 0; }
    .login-container input.otp-box { width: 60px; height: 70px; font-size: 2rem; font-weight: 700; text-align: center; padding: 0; margin: 0; border-radius: 12px; border: 2px solid var(--border-color); background: var(--bg-main); color: var(--text-dark); box-sizing: border-box; }
    .login-container input.otp-box:focus { border-color: var(--accent-blue); outline: none; }
    .pin-links { display: none; flex-direction: column; align-items: center; gap: 2px; margin: 14px auto 0; }
    .login-container button.link-btn { width: auto; background: none; border: none; padding: 6px 2px; margin: 0; color: var(--accent-blue); font-weight: 600; font-size: 0.95rem; cursor: pointer; }
    .login-container button.link-btn:disabled { color: var(--text-muted); cursor: default; }

    /* MOBILE RESPONSIVE QUERIES */
    @media (max-width: 768px) {
      /* ENLARGED MOBILE LOGIN SCREEN */
      .login-container { width: 90%; max-width: none; margin: 60px auto; padding: 40px 25px; }
      .login-container h2 { font-size: 2.2rem; }
      .login-container p { font-size: 1.15rem; }
      .login-container input[type="email"] { width: 100%; font-size: 1.2rem; padding: 18px; border-radius: 10px; }
      .login-container button { width: 100%; font-size: 1.3rem; padding: 18px; border-radius: 10px; margin-top: 15px; }
      .otp-container { gap: 15px; }
      .login-container input.otp-box { width: 65px; height: 80px; font-size: 2.5rem; }

      .navbar { padding: 10px; gap: 8px; }
      .workspace { padding: 10px; }
      
      .grid-layout { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .flap-card { padding: 10px; gap: 6px; }
      .card-title { font-size: 0.85rem; }
      .preview-text { font-size: 0.65rem; }
      .card-meta { font-size: 0.65rem; }
      .compare-toggle { font-size: 0.65rem; text-align: center; }
      .card-actions { padding-top: 8px; flex-direction: column; }
      
      /* Dynamic Matrix Capping for Mobile (Max 3 Flaps) */
      .matrix-table { border-spacing: 12px 0; }
      .matrix-table th, .matrix-table td {
        /* Cap width at 3 on mobile. Forces perfectly even division. */
        width: calc((100vw - 48px - ((min(var(--col-count), 3) - 1) * 12px)) / min(var(--col-count), 3));
      }
      .matrix-table th { padding: 15px 10px; font-size: 1rem; }
      .matrix-table td { padding: 10px; font-size: 0.85rem; }

      <input type="text" class="otp-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" onkeyup="handleOtp(this, event)" onfocus="this.select()">

  <!-- FULL-SCREEN IMAGE VIEWER -->

    <button class="lb-btn lb-next" id="lb-next" onclick="stepLightbox(1)" aria-label="Next image">›</button>
    <div class="lb-stage" id="lb-stage"><img id="lb-img" alt="" referrerpolicy="no-referrer"></div>
    <div class="lb-footer"><div id="lb-caption"></div><div class="lb-count" id="lb-count"></div></div>
  </div>

  <script>
    // PASTE YOUR LATEST DEPLOYMENT WEB APP URL MATRIX HERE
    const API_URL = "https://script.google.com/macros/s/AKfycbxvOBWU04kKiodMadYSpewnQz9xokfiwGW_krSjQNeSOYp00crRHTTTKd1rOSYWp78x/exec";

    let datasetMaster = [];
    let originalOrderMap = new Map();
    let activeCategoryFilter = "ALL";
    let selectedFlaps = new Set();
    let currentUserEmail = "";
    let isMatrixMinimized = false;

    const PREVIEW_KEYS = ["Introduction", "Arterial Anatomy", "Flap markings", "Flap dimensions"];

    // "cards" (default) or "list" (numbered contents page); remembered on this device
    let viewMode = (function () { try { return localStorage.getItem('flap_view') === 'list' ? 'list' : 'cards'; } catch (e) { return 'cards'; } })();

    // ---- FAVOURITES ----
    // Kept on the phone (works offline) and saved to the user's row on the server, so they
    // follow the user to another device. "flap_favs_dirty" marks changes not yet saved.
    let favouriteFlaps = new Set((function () { try { return JSON.parse(localStorage.getItem('flap_favs') || '[]'); } catch (e) { return []; } })());
    let favSyncTimer = null;

    function favKey(name) { return stripHTML(name).trim(); }
    function isFavourite(name) { return favouriteFlaps.has(favKey(name)); }

    function storeFavouritesLocally(markDirty) {
      try {
        localStorage.setItem('flap_favs', JSON.stringify(Array.from(favouriteFlaps)));
        if (markDirty) localStorage.setItem('flap_favs_dirty', '1');
      } catch (e) {}
    }

    // Called with the list the server sent at login. Unsaved local changes win and are pushed up.
    function applyServerFavourites(list) {
      if (!Array.isArray(list)) return;
      if (localStorage.getItem('flap_favs_dirty') === '1') { saveFavouritesToServer(); return; }
      favouriteFlaps = new Set(list);
      storeFavouritesLocally(false);
    }

    function saveFavouritesToServer() {
      const email = localStorage.getItem('flap_email');
      const token = localStorage.getItem('flap_token');
      if (!email || !token) return Promise.resolve();
      const list = Array.from(favouriteFlaps);
      return fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'save_favourites', email: email, token: token, favourites: list }),
        keepalive: true
      })
        .then(res => res.json())
        .then(data => {
          // Only clear the flag if nothing changed while this save was in flight
          if (data && data.saved && JSON.stringify(Array.from(favouriteFlaps)) === JSON.stringify(list)) {
            localStorage.removeItem('flap_favs_dirty');
          }
        })
        .catch(() => {}); // offline: stays marked as unsaved and is retried later
    }

    function toggleFavourite(name) {
      const key = favKey(name);
      if (favouriteFlaps.has(key)) favouriteFlaps.delete(key); else favouriteFlaps.add(key);
      storeFavouritesLocally(true);
      clearTimeout(favSyncTimer);
      favSyncTimer = setTimeout(saveFavouritesToServer, 1200);
      document.querySelectorAll('.fav-btn').forEach(btn => { if (btn.dataset.fav === key) paintStar(btn); });
      if (activeCategoryFilter === 'FAVOURITES') renderWorkspaceGrid();
    }

    function paintStar(btn) {
      const on = favouriteFlaps.has(btn.dataset.fav);
      btn.classList.toggle('on', on);
      btn.textContent = on ? '★' : '☆';
      btn.title = on ? 'Remove from Favourites' : 'Add to Favourites';
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    function makeStarButton(name, extraClass) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'fav-btn' + (extraClass ? ' ' + extraClass : '');
      btn.dataset.fav = favKey(name);
      btn.onclick = function (e) { e.stopPropagation(); toggleFavourite(name); };
      paintStar(btn);
      return btn;
    }

    // Retry unsaved favourites when the connection returns or the app is put in the background
    window.addEventListener('online', () => { if (localStorage.getItem('flap_favs_dirty') === '1') saveFavouritesToServer(); });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && localStorage.getItem('flap_favs_dirty') === '1') saveFavouritesToServer();
    });

    // Search + phone back button: while a search is active we keep one extra history entry,
    // so pressing back clears the search instead of closing the app
    let searchHistoryPushed = false;
    let scrollBeforeSearch = 0;

    // Rows named "Images" (or containing "image") hold picture links, not text
    function isImageKey(k) { return /image/i.test(stripHTML(k)); }
    function isHiddenKey(k) { const s = stripHTML(k); return s === 'name' || s === 'category' || s === 'Sub-Region Tag' || isImageKey(s); }

    // ---- SEARCH ----
    // What the user types is split into fragments ("rev sur fla" -> rev, sur, fla). A flap matches when every
    // fragment appears somewhere in it, in any order and not necessarily next to each other. Results are ranked:
    //   tier 0 - all fragments are in the flap's name
    //   tier 1 - all fragments are in its name plus its "Also Known As" names
    //   tier 2 - all fragments are somewhere in its content
    // Within a tier, fragments that start a word (Rev-erse Sur-al) and the whole query typed as one phrase rank higher.
    // Each flap's lower-case text is prepared once and reused on every keystroke.
    const searchTextCache = new WeakMap();
    // Plain text of a field; line breaks become " · " so separate lines do not run together into one word
    function searchPlain(v) { return stripHTML(String(v || '').replace(/<br\s*\/?>/gi, ' · ')); }
    let searchRanks = new Map(); // flap -> { tier, score } for the current search, filled by getFilteredFlaps
    function searchText(flap) {
      let c = searchTextCache.get(flap);
      if (!c) {
        const name = stripHTML(flap.name).toLowerCase();
        const aka = searchPlain(getField(flap, 'Also Known As')).toLowerCase();
        const fields = [];
        Object.entries(flap).forEach(([k, v]) => {
          if (k === 'name' || k === 'category' || isImageKey(k)) return;
          const text = searchPlain(v);
          if (text) fields.push({ key: k, text: text, lower: text.toLowerCase() });
        });
        c = { name: name, nameAka: name + ' | ' + aka, all: name + ' | ' + fields.map(f => f.lower).join(' | '), fields: fields };
        searchTextCache.set(flap, c);
      }
      return c;
    }
    function searchTokens(query) { return String(query || '').toLowerCase().split(/\s+/).filter(Boolean); }
    // true when the fragment begins a word somewhere in the text
    function startsWord(text, token) {
      for (let i = text.indexOf(token); i !== -1; i = text.indexOf(token, i + 1)) {
        if (i === 0 || !/[a-z0-9]/.test(text[i - 1])) return true;
      }
      return false;
    }
    // null when the flap does not match; otherwise { tier, score } (lower tier first, then higher score)
    function searchRank(flap, tokens) {
      const t = searchText(flap);
      const hasAll = text => tokens.every(tok => text.includes(tok));
      let tier, text;
      if (hasAll(t.name)) { tier = 0; text = t.name; }
      else if (hasAll(t.nameAka)) { tier = 1; text = t.nameAka; }
      else if (hasAll(t.all)) { tier = 2; text = t.all; }
      else return null;
      let score = tokens.filter(tok => startsWord(text, tok)).length;
      if (tokens.length > 1 && text.includes(tokens.join(' '))) score += tokens.length;
      return { tier: tier, score: score };
    }

    // First line of a field (lines are separated by <br> or new lines)
    function firstLine(html) {
      if (!html) return '';
      const parts = String(html).split(/<br\s*\/?>|\n/i).map(p => stripHTML(p)).filter(Boolean);
      return parts[0] || '';
    }

    function getSubRegionOrder() {
      const orderConfig = datasetMaster.find(f => stripHTML(f.name).toLowerCase().includes('order') && f.category === 'System');
      if (!orderConfig) return [];
      const contentKey = Object.keys(orderConfig).find(k => stripHTML(k).toLowerCase() === 'content');
      if (!contentKey || !orderConfig[contentKey]) return [];
      // The order can be typed as "Thigh, Leg" in one cell or one name per row (arrives as line breaks)
      const cleanContent = stripHTML(orderConfig[contentKey].replace(/<br\s*\/?>/gi, ','));
      return cleanContent.split(/[,\n]/).map(t => t.trim()).filter(Boolean);
    }

    function firstTag(flap) {
      const raw = stripHTML(flap['Sub-Region Tag']);
      return raw ? raw.split(',')[0].trim() : '';
    }

    // OTP BOX NAVIGATION HANDLER
    function handleOtp(current, event) {
        if (event.key === 'Backspace') {
            if (current.previousElementSibling) current.previousElementSibling.focus();
        } else if (current.value.length === 1 && event.key !== 'Backspace') {
            if (current.nextElementSibling) current.nextElementSibling.focus();
        }
    }

    // GLOBAL SIDEBAR FUNCTIONS
    function toggleSidebarDrawer() {
      const sidebar = document.querySelector('.sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      
      if (sidebar.classList.contains('open')) {
        overlay.style.display = 'block';
        setTimeout(() => overlay.classList.add('active'), 10); 
      } else {
        closeSidebarDrawer();
      }
    }

    function closeSidebarDrawer() {
      document.querySelector('.sidebar').classList.remove('open');
      const overlay = document.getElementById('sidebar-overlay');
      overlay.classList.remove('active');
      setTimeout(() => overlay.style.display = 'none', 300);
    }

    function stripHTML(text) {
      if (!text) return "";
      return text.toString().replace(/<[^>]*>?/gm, '').trim();
    }

    // Field names in the sheet may differ in capitals from the names used here ("Flap Markings" vs "Flap markings")
    function getField(flap, key) {
      const wanted = key.toLowerCase();
      const realKey = Object.keys(flap).find(k => stripHTML(k).toLowerCase() === wanted);
      return realKey ? flap[realKey] : "";
    }

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function toggleTheme() {
      const isDark = document.body.classList.toggle('dark-theme');
      localStorage.setItem('flap_theme', isDark ? 'dark' : 'light');
    }

    window.onload = function() {
      if (localStorage.getItem('flap_theme') === 'dark') { document.body.classList.add('dark-theme'); }
      const savedEmail = localStorage.getItem('flap_email');
      const savedToken = localStorage.getItem('flap_token');
      const cachedFlaps = localStorage.getItem('flap_data_cache');

      if (savedEmail && savedToken) {
        currentUserEmail = savedEmail;
        document.getElementById('email-input').style.display = 'none';
        document.getElementById('action-btn').style.display = 'none';
        document.getElementById('login-desc').innerText = "Signing you in...";

        if (cachedFlaps) { initializeSystem(JSON.parse(cachedFlaps)); }

        fetch(API_URL + "?action=auto_login&email=" + encodeURIComponent(savedEmail) + "&token=" + encodeURIComponent(savedToken))
          .then(res => res.json())
          .then(data => { 
            if (data.flaps && !data.locked) {
                localStorage.setItem('flap_data_cache', JSON.stringify(data.flaps));
                applyServerFavourites(data.favourites);
                initializeSystem(data.flaps);
            } else { logOut(); } 
          })
          .catch(() => {
              if(!cachedFlaps) {
                 document.getElementById('login-desc').innerText = "Couldn't reach the server. Enter your email to get a new login PIN.";
                 const emailBox = document.getElementById('email-input');
                 emailBox.style.display = 'inline-block';
                 emailBox.value = savedEmail; 
                 const actionBtn = document.getElementById('action-btn');
                 actionBtn.style.display = 'block';
                 actionBtn.innerText = "Send Login PIN";
              }
          });
      }
    };

    const PIN_VALID_MINUTES = 3;     // must match PIN_TTL_SECONDS in the backend
    const RESEND_AFTER_SECONDS = 30; // wait before another PIN can be requested
    let resendTimer = null;

    function setLoginText(text) { document.getElementById('login-desc').innerText = text; }

    function startResendCountdown() {
      const rb = document.getElementById('resend-btn');
      let left = RESEND_AFTER_SECONDS;
      clearInterval(resendTimer);
      rb.disabled = true; rb.innerText = 'Resend PIN in ' + left + 's';
      resendTimer = setInterval(() => {
        left--;
        if (left <= 0) { clearInterval(resendTimer); rb.disabled = false; rb.innerText = 'Resend PIN'; }
        else rb.innerText = 'Resend PIN in ' + left + 's';
      }, 1000);
    }

    // Back to the email step
    function changeEmail() {
      clearInterval(resendTimer);
      document.getElementById('otp-container').style.display = 'none';
      document.getElementById('pin-links').style.display = 'none';
      const emailInput = document.getElementById('email-input');
      emailInput.style.display = 'inline-block';
      const btn = document.getElementById('action-btn');
      btn.innerText = 'Send Login PIN'; btn.onclick = requestPin; btn.disabled = false;
      setLoginText("Enter your registered email and we'll send you a login PIN.");
      emailInput.focus();
    }

    function sendPin(isResend) {
      const btn = document.getElementById('action-btn');
      const rb = document.getElementById('resend-btn');
      if (isResend) { rb.disabled = true; rb.innerText = 'Sending...'; }
      else { btn.innerText = 'Sending PIN...'; btn.disabled = true; }
      document.getElementById('paywall-message').style.display = 'none';

      return fetch(API_URL + "?action=request_pin&email=" + encodeURIComponent(currentUserEmail))
        .then(res => res.json())
        .then(data => {
          btn.disabled = false;
          if (data.error) {
            alert(data.error);
            if (isResend) startResendCountdown(); else btn.innerText = 'Send Login PIN';
          } else if (data.locked) {
            document.getElementById('paywall-message').style.display = 'block';
            if (!isResend) btn.innerText = 'Send Login PIN';
          } else if (data.step === "pin_sent") {
            document.getElementById('email-input').style.display = "none";
            document.getElementById('otp-container').style.display = "flex";
            document.getElementById('pin-links').style.display = "flex";
            document.querySelectorAll('.otp-box').forEach(b => b.value = '');
            setLoginText((isResend ? 'A new login PIN has been sent to ' : 'We have emailed a 4-digit login PIN to ') + currentUserEmail +
              '. It is valid for ' + PIN_VALID_MINUTES + ' minutes.' + (isResend ? ' The earlier PIN no longer works.' : ''));
            btn.innerText = "Verify PIN";
            btn.onclick = verifyPin;
            startResendCountdown();
            document.querySelector('.otp-box').focus();
          }
        }).catch(() => {
          btn.disabled = false;
          alert("Couldn't reach the server. Please check your connection.");
          if (isResend) startResendCountdown(); else btn.innerText = 'Send Login PIN';
        });
    }

    function requestPin() {
      const emailInput = document.getElementById('email-input');
      currentUserEmail = emailInput.value.trim();
      if (!currentUserEmail) return alert("Please enter your email.");
      sendPin(false);
    }

    function resendPin() { if (currentUserEmail) sendPin(true); }

    function verifyPin() {
      // Concatenate values from the 4 boxes
      const pin = Array.from(document.querySelectorAll('.otp-box')).map(i => i.value).join('');

      if (pin.length !== 4) return alert("Please enter the complete 4-digit PIN.");

      const btn = document.getElementById('action-btn');
      btn.innerText = "Verifying PIN...";
      btn.disabled = true;

      fetch(API_URL + "?action=verify_pin&email=" + encodeURIComponent(currentUserEmail) + "&pin=" + encodeURIComponent(pin))
        .then(res => res.json())
        .then(data => {
          btn.disabled = false;
          if (data.error) {
            alert(data.error);
            document.querySelectorAll('.otp-box').forEach(b => b.value = '');
            btn.innerText = "Verify PIN";
            if (data.restart) {
              // PIN expired or too many wrong tries: a new one is needed
              setLoginText('That PIN can no longer be used. Tap "Resend PIN" to get a new one.');
              clearInterval(resendTimer);
              const rb = document.getElementById('resend-btn'); rb.disabled = false; rb.innerText = 'Resend PIN';
            } else {
              document.querySelector('.otp-box').focus();
            }
          } else if (data.flaps) {
            clearInterval(resendTimer);
            localStorage.setItem('flap_email', currentUserEmail);
            localStorage.setItem('flap_token', data.token);
            localStorage.setItem('flap_data_cache', JSON.stringify(data.flaps));
            applyServerFavourites(data.favourites);
            initializeSystem(data.flaps);
          }
        }).catch(() => {
          btn.disabled = false;
          alert("Couldn't reach the server. Please check your connection.");
          btn.innerText = "Verify PIN";
        });
    }

    function logOut() {
        const finish = () => {
            ['flap_email', 'flap_token', 'flap_data_cache', 'flap_favs', 'flap_favs_dirty', 'flap_state'].forEach(k => localStorage.removeItem(k));
            location.reload();
        };
        // Save any unsaved favourites first (waits at most 3 seconds)
        if (localStorage.getItem('flap_favs_dirty') === '1') {
            Promise.race([saveFavouritesToServer(), new Promise(r => setTimeout(r, 3000))]).then(finish);
        } else {
            finish();
        }
    }

    // Region icons live in icons/regions/<slug>.png (white lines on transparent).
    // They are used as a CSS mask, so the app colours them to match the theme.
    const REGION_ICONS = ['all-references', 'head-neck', 'upper-extremity', 'trunk', 'groin-perineum', 'lower-extremity', 'local-flaps', 'favourites'];
    function regionSlug(name) { return String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

    function makeRegionTile(label, wide) {
      const div = document.createElement('div');
      div.className = 'menu-item region-tile' + (wide ? ' wide' : '');
      const icon = document.createElement('span');
      icon.className = 'region-icon';
      const slug = regionSlug(label);
      if (REGION_ICONS.includes(slug)) {
        icon.style.setProperty('--icon', "url('icons/regions/" + slug + ".png')");
      } else {
        icon.classList.add('no-icon');
        icon.textContent = label.charAt(0).toUpperCase();
      }
      const text = document.createElement('span');
      text.className = 'region-label';
      text.textContent = label;
      div.appendChild(icon);
      div.appendChild(text);
      return div;
    }

    function initializeSystem(flaps) {
      // first start: the screen saved when the app was last closed; later refreshes: keep the current screen
      const screenToShow = stateRestored ? captureState() : loadSavedState();
      datasetMaster = flaps;
      datasetMaster.forEach((f, i) => originalOrderMap.set(f.name, i));
      
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-shell').style.display = 'flex';
      
      document.getElementById('user-profile-section').style.display = 'flex';
      document.getElementById('display-user-email').innerText = currentUserEmail;
      
      const chapterMenu = document.getElementById('chapter-menu');
      const systemMenu = document.getElementById('system-menu');
      
      chapterMenu.innerHTML = '';
      chapterMenu.classList.add('region-grid');
      const allTile = makeRegionTile('All References', true);
      allTile.classList.add('active');
      allTile.onclick = function() { filterCategory('ALL', allTile); };
      allTile.dataset.cat = 'ALL';
      chapterMenu.appendChild(allTile);
      systemMenu.innerHTML = '';

      let systemPages = [];
      const uniqueCategories = [...new Set(flaps.map(f => f.category))];

      uniqueCategories.forEach(cat => {
        if (cat === 'System') {
          systemPages = datasetMaster.filter(f => f.category === 'System');
        } else {
          const div = makeRegionTile(stripHTML(cat), false);
          div.onclick = function() { filterCategory(cat, div); };
          div.dataset.cat = cat;
          chapterMenu.appendChild(div);
        }
      });

      // Favourites: the user's own starred flaps, always last
      const favTile = makeRegionTile('Favourites', true);
      favTile.classList.add('fav-tile');
      favTile.onclick = function() { filterCategory('FAVOURITES', favTile); };
      favTile.dataset.cat = 'FAVOURITES';
      chapterMenu.appendChild(favTile);
      if (activeCategoryFilter === 'FAVOURITES') {
        document.querySelectorAll('#chapter-menu .menu-item').forEach(el => el.classList.remove('active'));
        favTile.classList.add('active');
      }

      if (systemPages.length > 0) {
        systemMenu.style.display = 'block';
        const divider = document.createElement('div');
        divider.className = "system-divider";
        divider.innerText = "System";
        systemMenu.appendChild(divider);

        systemPages.forEach(page => {
           const cleanName = stripHTML(page.name).toLowerCase();
           if (cleanName.includes('order')) return; 

           const div = document.createElement('div');
           div.className = "menu-item"; div.innerText = stripHTML(page.name);
           div.onclick = function() { viewSystemPage(page.name, div); };
           systemMenu.appendChild(div);
        });
      }

      renderWorkspaceGrid();
      applyState(screenToShow);
      stateRestored = true;
    }

    // ---- REMEMBER THE SCREEN ----
    // A small record (a few hundred characters) of what is on screen is kept on this device, so the app reopens
    // where the user left it: region, sub-region, sort order, ticked flaps, an open or minimised matrix, scroll position.
    let stateRestored = false;
    let matrixSingleFlap = null; // the flap shown when the matrix was opened for one flap
    function captureState() {
      const dock = document.getElementById('matrix-dock'), mc = document.getElementById('matrix-container');
      const open = dock && dock.classList.contains('open');
      return {
        cat: activeCategoryFilter,
        sub: document.getElementById('subregion-dropdown').value,
        sort: document.getElementById('sort-dropdown').value,
        sel: Array.from(selectedFlaps),
        matrix: open ? (matrixSingleFlap ? 'single' : 'open') : (isMatrixMinimized ? 'min' : ''),
        single: matrixSingleFlap,
        scroll: document.querySelector('.workspace').scrollTop,
        mTop: open && mc ? mc.scrollTop : 0, mLeft: open && mc ? mc.scrollLeft : 0
      };
    }
    function saveState() {
      if (!stateRestored || !datasetMaster.length) return;
      try { localStorage.setItem('flap_state', JSON.stringify(captureState())); } catch (e) {}
    }
    function loadSavedState() {
      try { return JSON.parse(localStorage.getItem('flap_state') || 'null'); } catch (e) { return null; }
    }
    function applyState(s) {
      if (!s) return;
      try {
        const exists = name => datasetMaster.some(f => f.name === name);
        const tile = Array.from(document.querySelectorAll('#chapter-menu .menu-item')).find(el => el.dataset.cat === s.cat);
        if (tile && s.cat !== 'ALL') { filterCategory(s.cat, tile); closeSidebarDrawer(); }
        const sub = document.getElementById('subregion-dropdown');
        if (s.sub && Array.from(sub.options).some(o => o.value === s.sub)) sub.value = s.sub;
        const sort = document.getElementById('sort-dropdown');
        if (s.sort && Array.from(sort.options).some(o => o.value === s.sort)) sort.value = s.sort;
        selectedFlaps = new Set((s.sel || []).filter(exists));
        renderWorkspaceGrid();
        const dock = document.getElementById('matrix-dock');
        if (s.matrix === 'open' && selectedFlaps.size) {
          if (dock.classList.contains('open')) buildMatrix(Array.from(selectedFlaps)); else openMatrix();
        } else if (s.matrix === 'single' && s.single && exists(s.single)) {
          if (dock.classList.contains('open')) buildMatrix([s.single]); else viewSingleFlap(s.single);
        } else if (s.matrix === 'min' && selectedFlaps.size) {
          isMatrixMinimized = true; updateCompareButton();
        }
        requestAnimationFrame(() => {
          document.querySelector('.workspace').scrollTop = s.scroll || 0;
          const mc = document.getElementById('matrix-container');
          if (mc && dock.classList.contains('open')) { mc.scrollTop = s.mTop || 0; mc.scrollLeft = s.mLeft || 0; }
        });
      } catch (e) { console.warn('Could not restore the last screen', e); }
    }
    // Saved whenever the app is hidden or closed, and shortly after anything changes
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveState(); });
    window.addEventListener('pagehide', saveState);
    let saveStateTimer = null;
    function saveStateSoon() { clearTimeout(saveStateTimer); saveStateTimer = setTimeout(saveState, 400); }
    document.addEventListener('scroll', saveStateSoon, true);
    document.addEventListener('click', saveStateSoon, true);
    document.addEventListener('change', saveStateSoon, true);

    // WhatsApp chat with the app's author, shown on the Help page
    const SUPPORT_WHATSAPP = '916282437283';
    const SUPPORT_LINK_HTML = `<a class="support-link" href="https://wa.me/${SUPPORT_WHATSAPP}" target="_blank" rel="noopener">`
      + `<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#fff" d="M16 3C8.8 3 3 8.7 3 15.8c0 2.5.7 4.9 2 7L3 29l6.4-2c2 1.1 4.3 1.7 6.6 1.7 7.2 0 13-5.7 13-12.8S23.2 3 16 3zm0 23.4c-2.1 0-4.1-.6-5.9-1.7l-.4-.3-3.8 1.2 1.2-3.7-.3-.4a10.5 10.5 0 0 1-1.7-5.7C5.1 9.9 10 5.1 16 5.1s10.9 4.8 10.9 10.7S22 26.4 16 26.4z"/>`
      + `<path fill="#fff" d="M12.2 9.6c-.3-.6-.6-.6-.9-.6h-.8c-.3 0-.7.1-1 .5-.4.4-1.3 1.3-1.3 3.1s1.4 3.6 1.5 3.8c.2.3 2.6 4.1 6.4 5.6 3.2 1.2 3.8 1 4.5.9.7-.1 2.2-.9 2.5-1.8.3-.9.3-1.6.2-1.8-.1-.2-.3-.3-.7-.5l-2.4-1.2c-.3-.1-.6-.2-.8.2-.2.4-.9 1.2-1.1 1.4-.2.2-.4.3-.8.1-.4-.2-1.6-.6-3-1.9-1.1-1-1.9-2.2-2.1-2.6-.2-.4 0-.6.2-.8l.6-.7c.2-.2.3-.4.4-.6.1-.3 0-.5 0-.7l-1.2-2.8z"/></svg>`
      + `<span>Support</span></a>`;

    function viewSystemPage(pageName, element) {
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      
      document.getElementById('flap-grid-canvas').style.display = 'none';
      document.getElementById('subregion-dropdown').style.display = 'none';
      document.getElementById('sort-dropdown').style.display = 'none';
      document.getElementById('select-all-btn').style.display = 'none';
      document.getElementById('clear-btn').style.display = 'none';
      document.getElementById('launch-matrix-btn').style.display = 'none';
      document.getElementById('view-toggle-btn').style.display = 'none';
      document.getElementById('search-wrap').style.display = 'none';
      
      document.getElementById('system-page-view').style.display = 'block';

      const pageData = datasetMaster.find(f => f.name === pageName && f.category === 'System');
      
      const contentKey = Object.keys(pageData).find(k => stripHTML(k).toLowerCase() === 'content');
      const contentBody = contentKey ? pageData[contentKey] : "<p style='color:var(--text-muted); font-style:italic;'>Data missing.</p>";
      
      const isHelp = stripHTML(pageData.name).trim().toLowerCase() === 'help';
      document.getElementById('system-page-view').innerHTML = `<h2>${stripHTML(pageData.name)}</h2><div>${contentBody}</div>` + (isHelp ? SUPPORT_LINK_HTML : '');

    }

    function filterCategory(cat, element) {
      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      activeCategoryFilter = cat;

      document.getElementById('system-page-view').style.display = 'none';
      document.getElementById('flap-grid-canvas').style.display = '';
      document.getElementById('sort-dropdown').style.display = 'inline-block';
      document.getElementById('select-all-btn').style.display = 'inline-block';
      document.getElementById('view-toggle-btn').style.display = 'inline-block';
      document.getElementById('search-wrap').style.display = 'flex';

      const subDropdown = document.getElementById('subregion-dropdown');
      if (cat === 'ALL' || cat === 'FAVOURITES') {
         subDropdown.style.display = 'none';
      } else {
         subDropdown.style.display = 'inline-block';
         let subTags = new Set();
         datasetMaster.forEach(f => {
            if(f.category === cat && f['Sub-Region Tag']) {
                const rawTagString = stripHTML(f['Sub-Region Tag']);
                rawTagString.split(',').forEach(tag => {
                    const cleanTag = tag.trim();
                    if(cleanTag) subTags.add(cleanTag);
                });
            }
         });

         const orderedTagsArray = getSubRegionOrder();

         let finalTags = Array.from(subTags);
         finalTags.sort((a, b) => {
             let indexA = orderedTagsArray.indexOf(a);
             let indexB = orderedTagsArray.indexOf(b);
             if (indexA === -1) indexA = 9999;
             if (indexB === -1) indexB = 9999;
             if (indexA === 9999 && indexB === 9999) return a.localeCompare(b);
             return indexA - indexB;
         });

         subDropdown.innerHTML = '<option value="ALL">All Sub-Regions</option>';
         finalTags.forEach(tag => {
            if(tag) subDropdown.innerHTML += `<option value="${tag}">${tag}</option>`;
         });
      }

      subDropdown.value = 'ALL';
      renderWorkspaceGrid();
      closeSidebarDrawer(); // Auto-close global sidebar drawer
    }

    // A short piece of text around the longest search fragment it contains, with every fragment highlighted
    function getSearchSnippet(text, tokens) {
      if (!text || !tokens.length) return "";
      const lower = text.toLowerCase();
      const present = tokens.filter(tok => lower.includes(tok)).sort((a, b) => b.length - a.length);
      if (!present.length) return "";
      const at = lower.indexOf(present[0]);
      // only a little text before the match, so the highlight stays inside the two lines a preview shows
      const start = Math.max(0, at - 14), end = Math.min(text.length, at + present[0].length + 80);
      const re = new RegExp(present.map(escapeRegExp).join('|'), 'gi');
      const piece = text.slice(start, end).replace(re, m => `<span class="search-highlight">${m}</span>`);
      return (start > 0 ? '...' : '') + piece + (end < text.length ? '...' : '');
    }

    function getFilteredFlaps() {
      const tokens = searchTokens(document.getElementById('search-input').value);
      const subDropdown = document.getElementById('subregion-dropdown');
      const subDropdownValue = subDropdown ? subDropdown.value : 'ALL';
      searchRanks = new Map();

      return datasetMaster.filter(flap => {
        if (flap.category === 'System') return false;
        if (activeCategoryFilter === 'FAVOURITES') {
            if (!isFavourite(flap.name)) return false;
        } else if (activeCategoryFilter !== "ALL" && flap.category !== activeCategoryFilter) return false;

        if (activeCategoryFilter !== "ALL" && activeCategoryFilter !== 'FAVOURITES' && subDropdownValue !== "ALL") {
            const rawTagString = stripHTML(flap['Sub-Region Tag']);
            const tags = rawTagString ? rawTagString.split(',').map(t=>t.trim()) : [];
            if (!tags.includes(subDropdownValue)) return false;
        }

        if (tokens.length) {
          const rank = searchRank(flap, tokens);
          if (!rank) return false;
          searchRanks.set(flap, rank);
        }
        return true;
      });
    }

    function renderWorkspaceGrid() {
      const canvas = document.getElementById('flap-grid-canvas');
      canvas.innerHTML = '';
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const sortMode = document.getElementById('sort-dropdown').value;
      const subDropdown = document.getElementById('subregion-dropdown');
      const subDropdownValue = subDropdown ? subDropdown.value : 'ALL';
      const isList = viewMode === 'list';

      canvas.className = isList ? 'list-layout' : 'grid-layout';
      const toggleBtn = document.getElementById('view-toggle-btn');
      if (toggleBtn) toggleBtn.innerHTML = isList ? '▦ Cards' : '☰ List';
      document.getElementById('search-clear').classList.toggle('visible', searchQuery !== '');

      let viewData = getFilteredFlaps();

      viewData.sort((a, b) => {
        // In card view, flaps ticked for the matrix float to the top; a contents list keeps its order
        if (!isList) {
          const aSel = selectedFlaps.has(a.name);
          const bSel = selectedFlaps.has(b.name);
          if (aSel && !bSel) return -1;
          if (!aSel && bSel) return 1;
        }

        // Best search matches first: name matches, then "Also Known As" matches, then content matches
        if (searchQuery) {
            const ra = searchRanks.get(a), rb = searchRanks.get(b);
            if (ra.tier !== rb.tier) return ra.tier - rb.tier;
            if (ra.score !== rb.score) return rb.score - ra.score;
        }

        if (sortMode === 'asc') return stripHTML(a.name).localeCompare(stripHTML(b.name));
        if (sortMode === 'desc') return stripHTML(b.name).localeCompare(stripHTML(a.name));

        return originalOrderMap.get(a.name) - originalOrderMap.get(b.name);
      });

      // Short "why this matched" text for search results: the field holding the most search fragments
      const queryTokens = searchTokens(searchQuery);
      function searchMatchHtml(flap) {
        let best = null, bestCount = 0;
        searchText(flap).fields.forEach(f => {
          if (f.key === 'Sub-Region Tag') return;
          const count = queryTokens.filter(tok => f.lower.includes(tok)).length;
          if (count > bestCount) { best = f; bestCount = count; }
        });
        return best ? { label: stripHTML(best.key), snippet: getSearchSnippet(best.text, queryTokens) } : null;
      }

      if (activeCategoryFilter === 'FAVOURITES' && viewData.length === 0) {
        canvas.className = 'list-layout';
        canvas.innerHTML = searchQuery
          ? '<div class="fav-empty">No favourites match this search.</div>'
          : '<div class="fav-empty"><div class="fav-empty-star">☆</div>No favourites yet.<br>Tap the ☆ on any flap to add it here.</div>';
        updateCompareButton();
        return;
      }

      if (isList) {
        renderListView(canvas, viewData, searchQuery, sortMode, subDropdownValue, searchMatchHtml);
        updateCompareButton();
        return;
      }

      viewData.forEach(flap => {
        const card = document.createElement('div');
        card.className = 'flap-card';
        card.onclick = () => viewSingleFlap(flap.name);

        let previewHtml = '';
        if (searchQuery && searchRanks.get(flap).tier > 0) {
            const hit = searchMatchHtml(flap);
            if (hit) previewHtml += `<div class="preview-label">Matched in ${hit.label}</div><div class="preview-text">${hit.snippet}</div>`;
        } else {
            PREVIEW_KEYS.forEach(key => {
                const value = getField(flap, key);
                if (value) {
                    const cleanText = stripHTML(value);
                    previewHtml += `<div class="preview-label">${key}</div><div class="preview-text">${cleanText}</div>`;
                }
            });
        }

        card.innerHTML = `
          <div>
            <div class="card-meta">${stripHTML(flap.category)}</div>
            <h4 class="card-title">${stripHTML(flap.name)}</h4>
            <div style="margin-top:12px;">${previewHtml}</div>
          </div>
          <div class="card-actions">
            <label class="compare-toggle" onclick="event.stopPropagation()">
              <input type="checkbox" ${selectedFlaps.has(flap.name) ? 'checked' : ''}>
              Select for Matrix
            </label>
          </div>
        `;
        // Attached here rather than inline, so names with apostrophes (e.g. "Limberg's") work
        card.querySelector('.compare-toggle input').onchange = function() { toggleSelection(flap.name, this); };
        card.appendChild(makeStarButton(flap.name, 'card-fav'));
        canvas.appendChild(card);
      });
      updateCompareButton();
    }

    // Numbered contents-page view. Numbers are worked out every time from what is on screen,
    // so they always run 1, 2, 3... for the current chapter, sub-region or search.
    function renderListView(canvas, viewData, searchQuery, sortMode, subDropdownValue, searchMatchHtml) {
      if (viewData.length === 0) {
        canvas.innerHTML = '<div class="list-heading" style="border:none;">No flaps found</div>';
        return;
      }

      // Group under headings (like a book's contents) when showing a whole chapter or everything in default order
      let groups = null;
      if (!searchQuery && sortMode === 'default') {
        if (activeCategoryFilter === 'ALL' || activeCategoryFilter === 'FAVOURITES') {
          const cats = [];
          viewData.forEach(f => { if (!cats.includes(f.category)) cats.push(f.category); });
          groups = cats.map(c => ({ title: stripHTML(c), items: viewData.filter(f => f.category === c) }));
        } else if (subDropdownValue === 'ALL') {
          const order = getSubRegionOrder();
          const tags = [];
          viewData.forEach(f => { const t = firstTag(f) || 'Other'; if (!tags.includes(t)) tags.push(t); });
          tags.sort((a, b) => {
            let ia = order.indexOf(a), ib = order.indexOf(b);
            if (ia === -1) ia = 9999; if (ib === -1) ib = 9999;
            return ia === ib ? a.localeCompare(b) : ia - ib;
          });
          groups = tags.map(t => ({ title: t, items: viewData.filter(f => (firstTag(f) || 'Other') === t) }));
        }
      }
      if (!groups) groups = [{ title: '', items: viewData }];

      let n = 0;
      groups.forEach(group => {
        if (group.title) {
          const h = document.createElement('div');
          h.className = 'list-heading';
          h.innerText = group.title;
          canvas.appendChild(h);
        }
        group.items.forEach(flap => {
          n += 1;
          const row = document.createElement('div');
          row.className = 'list-row';
          row.onclick = () => viewSingleFlap(flap.name);

          let sub = '';
          if (searchQuery && searchRanks.get(flap).tier > 0) {
            const hit = searchMatchHtml(flap);
            if (hit) sub = `<b>${hit.label}:</b> ${hit.snippet}`;
          } else {
            const aka = firstLine(getField(flap, 'Also Known As'));
            const artery = firstLine(getField(flap, 'Arterial Anatomy'));
            const bits = [aka, artery].filter(Boolean);
            sub = bits.join(' &middot; ');
          }
          const meta = (activeCategoryFilter === 'ALL' || activeCategoryFilter === 'FAVOURITES') && !groups[0].title ? `<span style="color:var(--accent-blue);font-weight:700;">${stripHTML(flap.category)}</span> &middot; ` : '';

          row.innerHTML = `
            <div class="list-num">${n}.</div>
            <div class="list-body">
              <div class="list-title">${stripHTML(flap.name)}</div>
              ${sub || meta ? `<div class="list-sub">${meta}${sub}</div>` : ''}
            </div>
            <input type="checkbox" class="list-check" title="Select for Matrix" ${selectedFlaps.has(flap.name) ? 'checked' : ''}>
          `;
          const cb = row.querySelector('.list-check');
          cb.onclick = (e) => e.stopPropagation();
          cb.onchange = function() { toggleSelection(flap.name, this); };
          row.insertBefore(makeStarButton(flap.name, 'list-fav'), cb);
          canvas.appendChild(row);
        });
      });
    }

    function toggleViewMode() {
      viewMode = viewMode === 'list' ? 'cards' : 'list';
      try { localStorage.setItem('flap_view', viewMode); } catch (e) {}
      renderWorkspaceGrid();
      document.querySelector('.workspace').scrollTop = 0;
    }

    // ---- SEARCH: clear button and phone back button ----
    function onSearchInput() {
      const input = document.getElementById('search-input');
      const hasText = input.value.trim() !== '';
      if (hasText && !searchHistoryPushed) {
        // Remember where the user was, and add a history step that "back" can undo
        scrollBeforeSearch = document.querySelector('.workspace').scrollTop;
        history.pushState({ view: 'search' }, '', '#search');
        searchHistoryPushed = true;
      } else if (!hasText && searchHistoryPushed) {
        searchHistoryPushed = false;
        history.back(); // removes the extra history step; the popstate handler then has nothing to do
      }
      renderWorkspaceGrid();
    }

    // Clears the search and returns to the list the user was on before searching
    function clearSearch(fromBackButton) {
      const input = document.getElementById('search-input');
      const hadSearch = input.value !== '';
      input.value = '';
      renderWorkspaceGrid();
      if (hadSearch) document.querySelector('.workspace').scrollTop = scrollBeforeSearch;
      if (searchHistoryPushed && !fromBackButton) {
        searchHistoryPushed = false;
        history.back();
      }
      searchHistoryPushed = false;
    }

    function toggleSelection(flapName, checkbox) {
      if (checkbox.checked) selectedFlaps.add(flapName);
      else selectedFlaps.delete(flapName);
      updateCompareButton();
    }

    function selectAllInView() {
      getFilteredFlaps().forEach(flap => selectedFlaps.add(flap.name));
      renderWorkspaceGrid();
    }

    function deselectAll() {
      selectedFlaps.clear();
      renderWorkspaceGrid();
    }

    function updateCompareButton() {
      const btn = document.getElementById('launch-matrix-btn');
      const clearBtn = document.getElementById('clear-btn');
      const count = selectedFlaps.size;
      
      if (count > 0) {
        btn.innerText = `Compare Core (${count})`;
        btn.classList.add('visible');
        clearBtn.style.display = 'inline-block'; 
        document.getElementById('fab-count').innerText = count;
        if (isMatrixMinimized) document.getElementById('matrix-fab').style.display = 'flex';
      } else {
        btn.classList.remove('visible');
        clearBtn.style.display = 'none'; 
        document.getElementById('matrix-fab').style.display = 'none';
        isMatrixMinimized = false;
        document.getElementById('matrix-dock').classList.remove('open');
      }
    }

    function viewSingleFlap(flapName) {
      if (selectedFlaps.has(flapName)) {
        openMatrix();
      } else {
        history.pushState({ view: 'matrix' }, "Matrix", "#matrix");
        matrixSingleFlap = flapName;
        buildMatrix([flapName]);
        document.getElementById('matrix-dock').classList.add('open');
        document.getElementById('matrix-fab').style.display = 'none';
        isMatrixMinimized = false;
      }
    }

    function openMatrix() {
      if (selectedFlaps.size === 0) return;
      history.pushState({ view: 'matrix' }, "Matrix", "#matrix");
      matrixSingleFlap = null;
      buildMatrix(Array.from(selectedFlaps));
      document.getElementById('matrix-dock').classList.add('open');
      document.getElementById('matrix-fab').style.display = 'none';
      isMatrixMinimized = false;
      renderWorkspaceGrid(); 
    }

    function minimizeMatrix() {
      document.getElementById('matrix-dock').classList.remove('open');
      document.getElementById('matrix-fab').style.display = 'flex';
      isMatrixMinimized = true;
    }

    function closeMatrix() {
      matrixSingleFlap = null;
      document.getElementById('matrix-dock').classList.remove('open');
      document.getElementById('matrix-fab').style.display = 'none';
      isMatrixMinimized = false;
      deselectAll(); 
    }

    function buildMatrix(flapNamesToCompare) {
      const container = document.getElementById('matrix-container');
      const flaps = flapNamesToCompare.map(name => datasetMaster.find(f => f.name === name));
      
      let attributeSet = new Set();
      flaps.forEach(f => Object.keys(f).forEach(k => { 
          if (stripHTML(k) !== 'name' && stripHTML(k) !== 'category' && stripHTML(k) !== 'Sub-Region Tag' && f[k].trim() !== '') attributeSet.add(k); 
      }));
      const attributes = Array.from(attributeSet);

      // INJECT COLUMN COUNT AS CSS VARIABLE FOR DYNAMIC SIZING
      let tableHtml = `<table class="matrix-table" style="--col-count: ${flaps.length}"><thead><tr>`;
      flaps.forEach((f, i) => tableHtml += `<th><span class="th-name">${stripHTML(f.name)}</span><span class="th-fav-slot" data-i="${i}"></span></th>`);
      tableHtml += `</tr></thead><tbody>`;

      galleryStore = [];
      attributes.forEach(attr => {
        tableHtml += `<tr>`;
        flaps.forEach(f => {
          const val = f[attr] ? f[attr].trim() : '';
          if (val && isImageKey(attr)) {
             tableHtml += `<td><div class="row-label">${stripHTML(attr)}</div>${buildGalleryHtml(val, stripHTML(f.name))}</td>`;
          } else if (val) {
             tableHtml += `<td><div class="row-label">${stripHTML(attr)}</div><div class="cell-data">${val}</div></td>`;
          } else {
             tableHtml += `<td></td>`;
          }
        });
        tableHtml += `</tr>`;
      });

      tableHtml += `</tbody></table>`;
      container.innerHTML = tableHtml;
      container.querySelectorAll('.th-fav-slot').forEach(slot => {
        slot.appendChild(makeStarButton(flaps[Number(slot.dataset.i)].name, 'th-fav'));
      });
    }

    // ---- IMAGES ----
    // The "Images" row holds one picture link per line, optionally followed by " | caption".
    // Google Drive share links are converted to direct image addresses (the file must be shared
    // as "Anyone with the link"). Any other https image link is used as it is.
    let galleryStore = [];

    function driveFileId(url) {
      const m = url.match(/\/d\/([\w-]{20,})/) || url.match(/[?&]id=([\w-]{20,})/);
      return m ? m[1] : null;
    }

    function parseImageField(html) {
      // Turn <a href="..."> into the bare address, then split into lines
      const flat = String(html).replace(/<a\s[^>]*href="([^"]+)"[^>]*>[\s\S]*?<\/a>/gi, ' $1 ');
      const lines = flat.split(/<br\s*\/?>|\n/i).map(l => stripHTML(l).replace(/&amp;/g, '&').trim()).filter(Boolean);
      const images = [];
      lines.forEach(line => {
        const m = line.match(/https?:\/\/[^\s|]+/);
        if (!m) return;
        const url = m[0];
        const caption = line.replace(url, '').replace(/^[\s|:\-–—]+/, '').trim();
        const id = driveFileId(url);
        images.push(id ? {
          thumb: `https://drive.google.com/thumbnail?id=${id}&sz=w600`,
          full: `https://drive.google.com/thumbnail?id=${id}&sz=w2400`,
          fallback: `https://lh3.googleusercontent.com/d/${id}=w2400`,
          caption
        } : { thumb: url, full: url, fallback: '', caption });
      });
      return images;
    }

    function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

    function buildGalleryHtml(html, flapName) {
      const images = parseImageField(html);
      if (images.length === 0) return `<div class="cell-data">${html}</div>`;
      const g = galleryStore.length;
      galleryStore.push({ name: flapName, images });
      return `<div class="img-gallery">${images.map((im, i) => `
        <figure class="img-thumb" onclick="openLightbox(${g}, ${i})">
          <img src="${escapeAttr(im.thumb)}" data-fallback="${escapeAttr(im.fallback)}" alt="${escapeAttr(im.caption || flapName)}" loading="lazy" referrerpolicy="no-referrer"
               onerror="if (this.dataset.fallback && this.dataset.tried !== '1') { this.dataset.tried = '1'; this.src = this.dataset.fallback; }">
          ${im.caption ? `<figcaption>${escapeAttr(im.caption)}</figcaption>` : ''}
        </figure>`).join('')}</div>`;
    }

    // Full-screen viewer: pinch / wheel / double-tap to zoom, drag to pan, swipe or arrows for next image
    const lb = { gallery: null, index: 0, scale: 1, x: 0, y: 0, pointers: new Map(), pinchDist: 0, pinchScale: 1, pinchMid: null, start: null, lastTap: 0 };

    function openLightbox(g, i) {
      lb.gallery = galleryStore[g];
      if (!lb.gallery) return;
      document.getElementById('lightbox').classList.add('open');
      history.pushState({ view: 'lightbox' }, '', '#image');
      showLightboxImage(i);
    }

    function closeLightbox(fromBackButton) {
      const box = document.getElementById('lightbox');
      if (!box.classList.contains('open')) return;
      box.classList.remove('open');
      if (!fromBackButton) history.back();
    }

    function showLightboxImage(i) {
      const imgs = lb.gallery.images;
      lb.index = (i + imgs.length) % imgs.length;
      const im = imgs[lb.index];
      const el = document.getElementById('lb-img');
      el.dataset.tried = '';
      el.onerror = function () { if (im.fallback && this.dataset.tried !== '1') { this.dataset.tried = '1'; this.src = im.fallback; } };
      el.src = im.full;
      document.getElementById('lb-caption').innerText = im.caption || lb.gallery.name;
      document.getElementById('lb-count').innerText = imgs.length > 1 ? `${lb.index + 1} / ${imgs.length}` : '';
      document.getElementById('lb-prev').style.display = imgs.length > 1 ? 'block' : 'none';
      document.getElementById('lb-next').style.display = imgs.length > 1 ? 'block' : 'none';
      resetZoom();
    }

    function stepLightbox(d) { if (lb.gallery) showLightboxImage(lb.index + d); }

    function applyZoom() {
      document.getElementById('lb-img').style.transform = `translate(${lb.x}px, ${lb.y}px) scale(${lb.scale})`;
    }
    function resetZoom() { lb.scale = 1; lb.x = 0; lb.y = 0; applyZoom(); }

    // Zoom about a point on screen, keeping that point still under the finger / cursor
    function zoomAt(newScale, cx, cy) {
      newScale = Math.min(6, Math.max(1, newScale));
      const img = document.getElementById('lb-img');
      const rect = img.getBoundingClientRect();
      const ox = rect.left - lb.x, oy = rect.top - lb.y;          // position before any pan
      const px = (cx - ox - lb.x) / lb.scale, py = (cy - oy - lb.y) / lb.scale;
      lb.scale = newScale;
      lb.x = cx - ox - px * newScale;
      lb.y = cy - oy - py * newScale;
      if (lb.scale === 1) { lb.x = 0; lb.y = 0; }
      applyZoom();
    }

    (function setupLightboxGestures() {
      const stage = document.getElementById('lb-stage');
      stage.addEventListener('pointerdown', e => {
        if (stage.setPointerCapture) stage.setPointerCapture(e.pointerId);
        lb.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (lb.pointers.size === 2) {
          const [a, b] = [...lb.pointers.values()];
          lb.pinchDist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
          lb.pinchScale = lb.scale;
          lb.pinchMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
          lb.start = null;
        } else {
          lb.start = { x: e.clientX, y: e.clientY, tx: lb.x, ty: lb.y, t: Date.now() };
        }
      });
      stage.addEventListener('pointermove', e => {
        if (!lb.pointers.has(e.pointerId)) return;
        lb.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (lb.pointers.size === 2) {
          const [a, b] = [...lb.pointers.values()];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          zoomAt(lb.pinchScale * dist / lb.pinchDist, lb.pinchMid.x, lb.pinchMid.y);
        } else if (lb.pointers.size === 1 && lb.scale > 1 && lb.start) {
          lb.x = lb.start.tx + (e.clientX - lb.start.x);
          lb.y = lb.start.ty + (e.clientY - lb.start.y);
          applyZoom();
        }
      });
      const endPointer = e => {
        if (!lb.pointers.has(e.pointerId)) return;
        lb.pointers.delete(e.pointerId);
        if (lb.pointers.size > 0 || !lb.start) return;
        const dx = e.clientX - lb.start.x, dy = e.clientY - lb.start.y;
        const quick = Date.now() - lb.start.t < 300 && Math.abs(dx) < 10 && Math.abs(dy) < 10;
        if (quick) {
          // double tap / double click toggles zoom
          if (Date.now() - lb.lastTap < 350) { zoomAt(lb.scale > 1 ? 1 : 2.5, e.clientX, e.clientY); lb.lastTap = 0; }
          else lb.lastTap = Date.now();
        } else if (lb.scale === 1 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
          stepLightbox(dx < 0 ? 1 : -1);      // swipe left / right
        } else if (lb.scale === 1 && dy > 100 && Math.abs(dy) > Math.abs(dx)) {
          closeLightbox();                    // swipe down to close
        }
        lb.start = null;
      };
      stage.addEventListener('pointerup', endPointer);
      stage.addEventListener('pointercancel', endPointer);
      stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(lb.scale * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, { passive: false });
      document.addEventListener('keydown', e => {
        if (!document.getElementById('lightbox').classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') stepLightbox(1);
        if (e.key === 'ArrowLeft') stepLightbox(-1);
      });
    })();

    // Phone / browser back button: close the topmost thing instead of leaving the app
    window.addEventListener('popstate', function(event) {
        if (document.getElementById('lightbox').classList.contains('open')) {
            closeLightbox(true);
        } else if (document.getElementById('matrix-dock').classList.contains('open')) {
            minimizeMatrix();
        } else if (searchHistoryPushed) {
            clearSearch(true);
            document.getElementById('search-input').blur();
        }
    });
    
  </script>
</body>
</html>
